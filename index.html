  <body>
    <div id="root">
    </div>
    <!--
      Static Netlify Forms blueprint: Netlify reads built HTML, not React-rendered
      form fields. The interactive form stays disabled until delivery is configured.
      Do not remove or rename the fields without updating WebContact.
    -->
    <form name="web-enquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="web-enquiry" />
      <input name="bot-field" />
      <input name="name" />
      <input name="business" />
      <input name="email" type="email" />
      <input name="website" />
      <input name="package" />
      <input name="budget" />
      <textarea name="description"></textarea>
      <input name="consent" />
    </form>
    <script type="module" src="/src/main.tsx">
    </script>
  </body>

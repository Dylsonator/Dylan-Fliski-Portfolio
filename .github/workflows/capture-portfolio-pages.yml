name: Capture real portfolio pages

on:
  push:
    branches: [real-portfolio-case-study-images-2026-11-22]
    paths:
      - scripts/capture-portfolio-pages.mjs
      - .github/workflows/capture-portfolio-pages.yml

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Install temporary screenshot tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build locally for accurate captures
        run: npm run build
      - name: Capture six real rendered sections
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/portfolio-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          node scripts/capture-portfolio-pages.mjs
      - name: Store screenshots as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: authentic-portfolio-captures
          path: public/images/portfolio/captures/*.jpg
          if-no-files-found: error
      - name: Commit screenshots to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/portfolio/captures
          if ! git diff --cached --quiet; then
            git commit -m "Capture authentic games and web portfolio screenshots"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
